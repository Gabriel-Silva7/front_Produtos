<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <div class="card">
            <header class="card-header">
                <h1>Cadastrar Produto</h1>
                <p>Preencha os dados abaixo para adicionar um novo produto ao catálogo.</p>
            </header>

            <form id="productForm" novalidate>
                <div class="form-grid">
                    <!-- Nome do Produto -->
                    <div class="form-group col-span-2">
                        <label for="nomeproduto">Nome do Produto</label>
                        <input 
                            type="text" 
                            id="nomeproduto" 
                            name="nomeproduto" 
                            placeholder="Ex: Tênis Esportivo Runner" 
                            required
                        >
                    </div>

                    <!-- Categoria -->
                    <div class="form-group">
                        <label for="categoria">Categoria</label>
                        <select id="categoria" name="categoria" required>
                            <option value="" disabled selected>Selecione uma categoria</option>
                            <option value="eletronicos">Eletrônicos</option>
                            <option value="vestuario">Vestuário</option>
                            <option value="casa">Casa e Decoração</option>
                            <option value="esportes">Esportes</option>
                            <option value="outros">Outros</option>
                        </select>
                    </div>

                    <!-- Preço -->
                    <div class="form-group">
                        <label for="preco">Preço (R$)</label>
                        <div class="price-input-wrapper">
                            <span>R$</span>
                            <input 
                                type="number" 
                                id="preco" 
                                name="preco" 
                                step="0.01" 
                                min="0" 
                                placeholder="0,00" 
                                required
                            >
                        </div>
                    </div>

                    <!-- Descrição -->
                    <div class="form-group col-span-2">
                        <label for="descricao">Descrição</label>
                        <textarea 
                            id="descricao" 
                            name="descricao" 
                            rows="4" 
                            placeholder="Descreva os detalhes e diferenciais do produto..."
                            required
                        ></textarea>
                    </div>

                    <!-- Upload da Foto -->
                    <div class="form-group col-span-2">
                        <label>Foto do Produto</label>
                        <div class="upload-container" id="uploadArea">
                            <input type="file" id="foto" name="foto" accept="image/*" class="file-input" required>
                            <div class="upload-placeholder" id="uploadPlaceholder">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                                <span><strong>Clique para enviar</strong> ou arraste e solte</span>
                                <small>PNG, JPG ou WEBP (Max: 5MB)</small>
                            </div>
                            <div class="image-preview hidden" id="imagePreview">
                                <img src="" alt="Preview da imagem" id="previewImg">
                                <button type="button" class="btn-remove" id="btnRemoveImage">&times;</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="reset" class="btn btn-secondary">Limpar</button>
                    <button type="submit" class="btn btn-primary">Cadastrar Produto</button>
                </div>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
